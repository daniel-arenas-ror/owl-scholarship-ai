name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: owl-api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: owl-api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: owl
          POSTGRES_PASSWORD: owl
          POSTGRES_DB: owl_api_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U owl" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      OWL_API_DATABASE_URL: postgresql+psycopg://owl:owl@localhost:5432/owl_api_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: owl-api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  web:
    name: owl-web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: owl-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: owl-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  admin:
    name: owl-admin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: owl-admin
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: owl
          POSTGRES_PASSWORD: owl
          POSTGRES_DB: owl
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U owl" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://owl:owl@localhost:5432/owl_admin
      TEST_DATABASE_URL: postgres://owl:owl@localhost:5432/owl_admin_test
      # owl-admin reads owl-api's scholarships table; the test suite creates the
      # table it needs inside this DB (see test/support/owl_api_schema.sql).
      OWL_API_TEST_DATABASE_URL: postgres://owl:owl@localhost:5432/owl_api_test
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: owl-admin
          bundler-cache: true
      - run: PGPASSWORD=owl createdb -h localhost -U owl owl_api_test
      - run: bin/rails db:prepare
      - run: bin/rails test
      - run: bin/rubocop --no-server
