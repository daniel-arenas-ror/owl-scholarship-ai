name: owl

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-owl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-owl}
      POSTGRES_DB: ${POSTGRES_DB:-owl}
    ports:
      - "5433:5432" # host 5433 to avoid clashing with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-owl} -d ${POSTGRES_DB:-owl}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./owl-api
      target: base
      args:
        INSTALL_DEV: "true"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      OWL_API_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-owl}:${POSTGRES_PASSWORD:-owl}@postgres:5432/owl_api
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-owl-dev}
    ports:
      - "8000:8000"
    volumes:
      - ./owl-api:/app
    depends_on:
      postgres:
        condition: service_healthy

  admin:
    build:
      context: ./owl-admin
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-owl}:${POSTGRES_PASSWORD:-owl}@postgres:5432/owl_admin
      TEST_DATABASE_URL: postgres://${POSTGRES_USER:-owl}:${POSTGRES_PASSWORD:-owl}@postgres:5432/owl_admin_test
      # owl-admin reads owl-api's `scholarships` table directly (plain postgres://
      # URL for ActiveRecord; owl-api uses the postgresql+psycopg:// form).
      OWL_API_DATABASE_URL: postgres://${POSTGRES_USER:-owl}:${POSTGRES_PASSWORD:-owl}@postgres:5432/owl_api
      OWL_API_TEST_DATABASE_URL: postgres://${POSTGRES_USER:-owl}:${POSTGRES_PASSWORD:-owl}@postgres:5432/owl_api_test
      OWL_API_URL: http://api:8000
      OWL_WEB_ORIGINS: http://localhost:5173
      # Only used to build the "trace ↗" links in the admin transcript view.
      LANGSMITH_HOST: ${LANGSMITH_HOST:-https://smith.langchain.com}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-owl-dev}
      BINDING: 0.0.0.0
    ports:
      - "3000:3000"
    volumes:
      - ./owl-admin:/rails
      - admin_bundle:/usr/local/bundle
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./owl-web
      target: dev
    command: npm run dev
    environment:
      VITE_ADMIN_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    volumes:
      - ./owl-web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - admin

volumes:
  pgdata:
  admin_bundle:
  web_node_modules:
