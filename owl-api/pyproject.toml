[project]
name = "owl-api"
version = "0.0.1"
description = "Owl AI service — retrieval, the multi-agent graph, and all OpenAI calls."
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection is built on Depends(...)/Query(...)/Body(...)
# as argument defaults — the intended pattern, not the mutable-default bug B008
# usually catches.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
