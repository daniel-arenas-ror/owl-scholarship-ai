# PostgreSQL. Connection details come from the environment so the same config
# works locally, in docker-compose, and on the EC2 host.
#
#   DATABASE_URL / TEST_DATABASE_URL          - owl-admin's own database
#   OWL_API_DATABASE_URL / OWL_API_TEST_...   - owl-api's database, which owl-admin
#     reads the `scholarships` table from directly. `database_tasks: false` keeps
#     Rails' migrate / schema tasks off it — owl-api owns that schema.
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  primary:
    <<: *default
    url: <%= ENV.fetch("DATABASE_URL", "postgres://owl:owl@localhost:5432/owl_admin") %>
  owl_api:
    <<: *default
    url: <%= ENV.fetch("OWL_API_DATABASE_URL", "postgres://owl:owl@localhost:5432/owl_api") %>
    database_tasks: false

test:
  primary:
    <<: *default
    url: <%= ENV.fetch("TEST_DATABASE_URL", "postgres://owl:owl@localhost:5432/owl_admin_test") %>
  owl_api:
    <<: *default
    url: <%= ENV.fetch("OWL_API_TEST_DATABASE_URL", "postgres://owl:owl@localhost:5432/owl_api_test") %>
    database_tasks: false

production:
  primary:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
  owl_api:
    <<: *default
    url: <%= ENV["OWL_API_DATABASE_URL"] %>
    database_tasks: false
